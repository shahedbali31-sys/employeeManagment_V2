<div class="card">
    <div class="card-header">
        <h2>Employee List</h2>
        <button class="logout-btn" (click)="logout()">🚪 Logout</button>
    </div>

    <div class="search-bar">
        <span>🔍</span>
        <input type="text" placeholder="Search by name..." [(ngModel)]="searchText"
            (input)="onSearch()">
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let employee of employees; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ employee.name }}</td>
                <td>{{ employee.department }}</td>
                <td>{{ employee.salary }}</td>
                <td class="action-btns">
                    <button class="update-btn" (click)="goToUpdateEmployee(employee.id || employee._id)" title="Update">
                        ✏️
                    </button>
                    <button class="delete-btn" (click)="deleteEmployee(employee.id || employee._id, employee.name)" title="Delete">
                        🗑️
                    </button>
                </td>
            </tr>
            <tr *ngIf="employees.length === 0">
                <td colspan="5">No employees found.</td>
            </tr>
        </tbody>
    </table>

    <button class="add-btn" (click)="goToAddEmployee()">➕ Add Employee</button>
</div>

<div class="toast-confirm" *ngIf="showConfirm">
    <div class="toast-confirm-box">
        <p>Are you sure you want to delete <strong>{{ employeeToDeleteName }}</strong>?</p>
        <div class="toast-confirm-btns">
            <button class="confirm-yes" (click)="confirmDelete()">Yes, Delete</button>
            <button class="confirm-no" (click)="cancelDelete()">Cancel</button>
        </div>
    </div>
</div>
