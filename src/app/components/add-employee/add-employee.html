<div class="card">
    <h2>👤 Add Employee</h2>

    <form [formGroup]="employeeForm">
        <table class="form-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <input class="form-input" type="text" placeholder="Enter name" formControlName="name">
                    </td>
                    <td>
                        <select class="form-input" formControlName="departmentId">
                            <option value="">Select department</option>
                            <option *ngFor="let dept of departments" [value]="dept.id">
                                {{ dept.name }}
                            </option>
                        </select>
                    </td>
                    <td>
                        <input class="form-input" type="number" placeholder="Enter salary (number)"
                            formControlName="salary">
                    </td>
                    <td class="action-btns">
                        <button class="AddEmployee-btn" (click)="addEmployee()">
                            + Add
                        </button>
                        <button class="back-btn" (click)="goBack()">
                            ← Back
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </form>
</div>
